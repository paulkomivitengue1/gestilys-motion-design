name: Rendre la publicité Gestilys

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ? (apercu = images clés ; video = MP4 complet)"
        type: choice
        default: video
        options: [video, apercu]
      generate_music:
        description: "Créer et ajouter la musique instrumentale originale de cette campagne"
        type: boolean
        default: true
      publish_release:
        description: "Publier les MP4 produits dans une Release GitHub"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: render-gestilys
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Installer FFmpeg
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1

      - name: Installer les dépendances de rendu Canvas
        run: npm ci --no-audit --no-fund

      - name: Vérifier la configuration
        run: npm run check

      - name: Rendre l'aperçu (images clés)
        if: ${{ inputs.mode == 'apercu' }}
        run: PREVIEW=1 npm run render

      - name: Publier l'aperçu
        if: ${{ inputs.mode == 'apercu' }}
        uses: actions/upload-artifact@v7
        with:
          name: apercu-images-gestilys
          path: out/preview/
          retention-days: 14

      - name: Rendre les images de la vidéo
        if: ${{ inputs.mode == 'video' }}
        run: npm run render

      - name: Assembler la vidéo H.264
        if: ${{ inputs.mode == 'video' }}
        run: bash scripts/encode.sh

      - name: Ajouter la musique originale (optionnelle)
        if: ${{ inputs.mode == 'video' }}
        env:
          GENERATE_MUSIC: ${{ inputs.generate_music && '1' || '0' }}
        run: bash scripts/mux.sh

      - name: Vérifier les deux MP4
        if: ${{ inputs.mode == 'video' }}
        run: |
          bash scripts/verify.sh out/gestilys-pub-1080x1920.mp4
          bash scripts/verify.sh out/gestilys-pub-whatsapp.mp4

      - name: Téléchargement direct du master MP4
        if: ${{ inputs.mode == 'video' }}
        uses: actions/upload-artifact@v7
        with:
          path: out/gestilys-pub-1080x1920.mp4
          archive: false
          retention-days: 14

      - name: Archive des versions et sources utiles
        if: ${{ inputs.mode == 'video' }}
        uses: actions/upload-artifact@v7
        with:
          name: gestilys-film-complet
          path: |
            out/gestilys-pub-1080x1920.mp4
            out/gestilys-pub-whatsapp.mp4
            out/gestilys-video-sans-audio.mp4
          compression-level: 0
          retention-days: 14

      - name: Publier les MP4 dans une Release
        if: ${{ inputs.mode == 'video' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="gestilys-campagne-${RUN_NUMBER}"
          gh release create "$TAG" \
            out/gestilys-pub-1080x1920.mp4 \
            out/gestilys-pub-whatsapp.mp4 \
            out/gestilys-video-sans-audio.mp4 \
            --title "Gestilys — nouvelle campagne 9:16 · ${RUN_NUMBER}" \
            --notes "Motion design original de 28 s, 1080×1920, 30 i/s, H.264/AAC."
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "### Campagne Gestilys prête" >> "$GITHUB_STEP_SUMMARY"
          echo "Téléchargements directs : $URL" >> "$GITHUB_STEP_SUMMARY"

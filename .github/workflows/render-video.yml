name: Rendre la publicité Gestilys

# Déclenchement manuel : onglet « Actions » → « Rendre la publicité Gestilys » → « Run workflow ».
# Dépôt public + exécuteur Linux standard = gratuit (voir README.md).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Que faire ? (apercu = quelques images clés en ~2 min ; video = MP4 complet)"
        type: choice
        default: video
        options:
          - video
          - apercu
      generate_music:
        description: "Ajouter une nappe musicale libre de droits générée automatiquement (si aucun fichier audio/music.* n'existe)"
        type: boolean
        default: false
      publish_release:
        description: "Publier le MP4 dans une Release GitHub (téléchargement direct recommandé sur téléphone)"
        type: boolean
        default: true

permissions:
  contents: write # nécessaire uniquement pour créer la Release

concurrency:
  group: render-gestilys
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      WORKERS: "4"
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Installer FFmpeg et les polices
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-liberation fonts-noto-core
          sudo apt-get install -y fonts-inter || echo "::warning::Police Inter indisponible, police de secours utilisée"
          fc-cache -f
          echo "Police utilisée pour « Inter » : $(fc-match Inter)"
          ffmpeg -version | head -1

      - name: Installer Playwright et Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Vérifier la configuration
        run: node scripts/check-config.mjs

      # ---------- Aperçu : quelques images clés ----------
      - name: Rendre l'aperçu (images clés)
        if: ${{ inputs.mode == 'apercu' }}
        run: PREVIEW=1 node scripts/render.mjs

      - name: Publier l'aperçu
        if: ${{ inputs.mode == 'apercu' }}
        uses: actions/upload-artifact@v7
        with:
          name: apercu-images
          path: out/preview/
          retention-days: 14

      # ---------- Vidéo complète ----------
      - name: Rendre les images de la vidéo
        if: ${{ inputs.mode == 'video' }}
        run: node scripts/render.mjs

      - name: Assembler la vidéo (H.264)
        if: ${{ inputs.mode == 'video' }}
        run: bash scripts/encode.sh

      - name: Ajouter l'audio (voix off / musique si présentes)
        if: ${{ inputs.mode == 'video' }}
        env:
          GENERATE_MUSIC: ${{ inputs.generate_music && '1' || '0' }}
        run: bash scripts/mux.sh

      - name: Vérifier les fichiers produits
        if: ${{ inputs.mode == 'video' }}
        run: |
          bash scripts/verify.sh out/gestilys-pub-1080x1920.mp4
          bash scripts/verify.sh out/gestilys-pub-whatsapp.mp4

      - name: Téléchargement direct du MP4 (sans ZIP)
        if: ${{ inputs.mode == 'video' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: out/gestilys-pub-1080x1920.mp4
          archive: false
          retention-days: 14

      - name: Téléchargement direct de la version WhatsApp (sans ZIP)
        if: ${{ inputs.mode == 'video' }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: out/gestilys-pub-whatsapp.mp4
          archive: false
          retention-days: 14

      - name: Archive ZIP de secours (3 fichiers)
        if: ${{ inputs.mode == 'video' }}
        uses: actions/upload-artifact@v7
        with:
          name: gestilys-video-complet
          path: |
            out/gestilys-pub-1080x1920.mp4
            out/gestilys-pub-whatsapp.mp4
            out/gestilys-video-sans-audio.mp4
          compression-level: 0
          retention-days: 14

      - name: Publier dans une Release GitHub
        if: ${{ inputs.mode == 'video' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          TAG="video-${RUN_NUMBER}"
          gh release create "$TAG" \
            out/gestilys-pub-1080x1920.mp4 \
            out/gestilys-pub-whatsapp.mp4 \
            out/gestilys-video-sans-audio.mp4 \
            --title "Publicité Gestilys — rendu n°${RUN_NUMBER}" \
            --notes "MP4 vertical 1080×1920. gestilys-pub-1080x1920.mp4 = qualité maître · gestilys-pub-whatsapp.mp4 = version plus légère · gestilys-video-sans-audio.mp4 = vidéo maître sans audio (sert à ajouter la voix off plus tard)."
          URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
          echo "### Vidéo prête" >> "$GITHUB_STEP_SUMMARY"
          echo "Téléchargement direct (Release) : $URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Release publiée : $URL"

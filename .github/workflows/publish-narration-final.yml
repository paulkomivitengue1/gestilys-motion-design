name: Publier la narration Gestilys finale

on:
  push:
    branches:
      - arena/5364221e-gestilys-motion-design
    paths:
      - deliverables/gestilys-narration-master-1080x1920.mp4
      - deliverables/gestilys-narration-whatsapp.mp4
      - .github/workflows/publish-narration-final.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Récupérer les livrables
        uses: actions/checkout@v7

      - name: Installer FFmpeg pour les contrôles
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Vérifier les deux MP4 et leur décodage complet
        run: |
          set -euo pipefail
          for f in \
            deliverables/gestilys-narration-master-1080x1920.mp4 \
            deliverables/gestilys-narration-whatsapp.mp4; do
            test -s "$f"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate \
              -of csv=p=0 "$f" | grep -Fx 'h264,1080,1920,30/1'
            ffprobe -v error -select_streams a:0 \
              -show_entries stream=codec_name -of csv=p=0 "$f" | grep -Fx 'aac'
            ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" \
              | awk '{ if ($1 < 27.9 || $1 > 28.1) exit 1 }'
            ffmpeg -v error -i "$f" -f null -
            sha256sum "$f"
          done

      - name: Joindre les deux MP4 à l'artefact téléchargeable
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: gestilys-narration-final
          path: |
            deliverables/gestilys-narration-master-1080x1920.mp4
            deliverables/gestilys-narration-whatsapp.mp4
          compression-level: 0
          retention-days: 90

      - name: Publier aussi des liens directs aux fichiers MP4
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG="gestilys-narration-final-${RUN_ID}"
          gh release create "$TAG" \
            deliverables/gestilys-narration-master-1080x1920.mp4 \
            deliverables/gestilys-narration-whatsapp.mp4 \
            --target "$SHA" \
            --title "Gestilys — narration finale" \
            --notes "Master vertical 1080×1920 et version légère WhatsApp, chacun avec narration française et musique discrète."
          echo "## Téléchargements Gestilys" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefact Actions : ${{ steps.artifact.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Master : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/gestilys-narration-master-1080x1920.mp4" >> "$GITHUB_STEP_SUMMARY"
          echo "WhatsApp : ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/download/${TAG}/gestilys-narration-whatsapp.mp4" >> "$GITHUB_STEP_SUMMARY"
